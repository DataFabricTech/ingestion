source:
  type: spline
  serviceName: spline_service
  serviceConnection:
    config:
      type: Spline
      hostPort: http://localhost:8081/
      uiHostPort: http://localhost:9090
  sourceConfig:
    config:
      type: PipelineMetadata
      dbServiceNames:
      - local_pipeline
      - local_postgres_empty1

      pipelineFilterPattern:
        includes:
        - .*jdbc.*
        - .*pipeline.*
sink:
  type: metadata-rest
  config:
    clusterName: openmetadata
workflowConfig:
  logging:
    logLevel: INFO
  processor:
    type: pipeline-status
    config:
      filterPattern:
        includes:
        - .*pipeline.*
