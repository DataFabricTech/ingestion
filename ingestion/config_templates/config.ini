; metadata collector 설정 템플릿
;
; 사용법
;   1) 이 파일을 복사합니다.
;        cp ingestion/config_templates/config.ini ingestion/config.ini
;   2) .env 에 설정 파일 경로를 지정합니다.
;        METADATA_COLLECTOR_CONFIG_FILE=config.ini
;   3) 아래 값을 환경에 맞게 채웁니다.

[security]
; 저장된 접속 비밀번호를 복호할 때 쓰는 키
cryptkey = <CRYPT_KEY>

[catalog_api]
; 수집 대상 정보 조회와 수집 상태 보고에 사용하는 카탈로그 API
host = <CATALOG_API_HOST>
port = 8080
prefix = /api/v1
; 수집 대상의 접속 정보를 조회하는 경로
get_meta_system_info_api = /system/info
; 수집 상태를 보고하는 경로
set_meta_ingestion_status_api = /system/status

[minio]
; 비정형 데이터 저장소
url = <MINIO_HOST>:9000
; 데이터 추출 결과를 두는 버킷. 수집 대상에서 제외됩니다
dataextract_bucket = <DATAEXTRACT_BUCKET>
; 샘플 데이터를 두는 버킷. 수집 대상에서 제외됩니다
sample_data_bucket = <SAMPLE_DATA_BUCKET>

[metadata_collector]
; 문서 파일을 변환·추출할 때 사용하는 임시 디렉토리
document_tmp_dir = /tmp/metadata_collector

[ingestion]
; 수집 작업 정의 파일을 두는 경로
system_config_path = ./conf/ingestion
