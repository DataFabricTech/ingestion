version: '0.1'

services:
  metadata-collector:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    image: data-catalog-metadata-collector:$DATA_CATALOG_SOLUTION_IMG_VERSION
    container_name: metadata-collector
    ports:
      - "8587:8587"
    volumes:
      - $DATA_CATALOG_SOLUTION_DATA/metadata_collector/conf:/metadata_collector/conf
      - $DATA_CATALOG_SOLUTION_DATA/metadata_collector/logs:/metadata_collector/logs
      - $DATA_CATALOG_SOLUTION_DATA/ingestion/script:/catalog-api/ingestion/script
    environment:
      - METADATA_COLLECTOR_CONFIG_FILE=/metadata_collector/conf/config.ini
    command: ["tail", "-f", "/dev/null"]

